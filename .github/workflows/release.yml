name: Publicar Release y Actualización

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias del Frontend
        run: npm install

      - name: Compilar y Publicar en GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Atenea v__VERSION__'
          releaseBody: |
            ## 🚀 Atenea v__VERSION__ - Actualizaciones Refinadas

            Esta versión trae mejoras en la experiencia del actualizador y correcciones visuales.

            ### ✨ Novedades
            - **Pantalla de actualización renovada:** El modal de nueva versión ahora muestra el registro de cambios real (changelog) con formato premium y un enlace directo a GitHub.
            - **Corrección de CSP:** Solucionado el bloqueo de imágenes locales (portadas en caché) que afectaba a la versión 0.2.5.
            
            *Actualización automática recomendada.*
          releaseDraft: true
          prerelease: false