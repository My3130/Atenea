name: Publicar Release y Actualización

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias del Frontend
        run: npm install

      - name: Compilar y Publicar en GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Atenea v__VERSION__'
          releaseBody: |
            ## 🛠️ Atenea v0.2.8 - Árbol Celestial 3D, interruptor de hardware RAM/GPU, constelaciones selectivas, barra retráctil

            Esta actualización trae mejoras de diseño

            ### ✨ Novedades
            - **Modelo de Árbol 3D:** Se ha implementado un modelo de árbol 3D optimizado para representar la estructura de la biblioteca como una constelación. La visualización 3D de un árbol de conocimiento convierte la experiencia del usuario en algo más intuitivo y atractivo a diferencia de la representación tradicional en 2D.
            - **Interruptor de Hardware RAM/GPU:** Se ha añadido un interruptor que permite a los usuarios elegir entre utilizar la RAM o la GPU para el procesamiento de datos. Esto permite una mayor flexibilidad y optimización del rendimiento según las capacidades del sistema del usuario. 

            *Actualización recomendada para todos los usuarios. Se recomienda reiniciar la aplicación después de la instalación.*
          releaseDraft: true
          prerelease: false