name: Publicar Release y Actualización

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias del Frontend
        run: npm install

      - name: Compilar y Publicar en GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Atenea v__VERSION__'
          releaseBody: |
            ## 🛠️ Atenea v__VERSION__ - Corrección de Portadas y Estabilidad

            Esta actualización soluciona un problema crítico introducido en la versión anterior relacionado con la seguridad y la caché local.

            ### 🐛 Correcciones
            - **Fix de Portadas Locales (CSP):** Se ha corregido la política de seguridad (Content Security Policy) que bloqueaba silenciosamente la carga de las portadas guardadas en la caché local (IndexedDB). Ahora las imágenes vuelven a mostrarse correctamente en la vista principal de la biblioteca.
            - **Estabilidad General:** Mejoras internas en el manejo de errores de red.

            *Actualización recomendada para todos los usuarios de la v0.2.5.*
          releaseDraft: true
          prerelease: false